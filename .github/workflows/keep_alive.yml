name: Database Keep-Alive

on:
  schedule:
    - cron: '0 */4 * * *'  # Run every 4 hours
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest

    steps:
      - name: Ping Database
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          psql $DATABASE_URL -c "SELECT 1;"
