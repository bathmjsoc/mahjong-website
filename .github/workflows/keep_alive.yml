name: Database Keep-Alive

on:
  schedule:
    - cron: '0 0 */5 * *'  # Run every five days at midnight
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest

    steps:
      - name: Ping Database
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |       
          psql $DATABASE_URL -c "
            INSERT INTO public.keep_alive DEFAULT VALUES;
          
            DELETE FROM public.keep_alive 
            WHERE id NOT IN (
              SELECT id FROM public.keep_alive ORDER BY timestamp DESC LIMIT 5
            );
          "
